name: Release

# Publishes package.json's version to npm, then tags it v<version> and
# posts a GitHub release with the matching CHANGELOG.md section. Run it
# by hand from main; npm refuses a version that is already published.
# Authenticates with npm trusted publishing (OIDC), so no npm token is
# stored in the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      # Refuse missing, duplicate or empty release notes before publishing.
      - name: Validate release changelog
        run: node scripts/release-notes.mjs "$(node -p 'require("./package.json").version')" > /dev/null
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: node scripts/smoke-package.mjs
      # Node 22 bundles npm 10; trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.16.0 --ignore-scripts
      # prepack builds a clean dist/ first.
      - run: npm publish --loglevel verbose

  # A separate job, so the write token never meets npm or install scripts.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
